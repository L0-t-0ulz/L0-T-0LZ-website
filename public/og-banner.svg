<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3aa0ff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#b46cff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf6ff"/>
      <stop offset="30%" stop-color="#7df9ff"/>
      <stop offset="70%" stop-color="#3aa0ff"/>
      <stop offset="100%" stop-color="#0a1830"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eaf6ff"/>
      <stop offset="60%" stop-color="#6cc5ff"/>
      <stop offset="100%" stop-color="#7df9ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#05070d"/>
  <!-- faint grid -->
  <g stroke="#6cc5ff" stroke-opacity="0.08">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- HUD corner crop-marks -->
  <g stroke="#6cc5ff" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M40 70 V40 H70"/>
    <path d="M1130 40 H1160 V70"/>
    <path d="M40 560 V590 H70"/>
    <path d="M1130 590 H1160 V560"/>
  </g>

  <!-- eyes -->
  <g transform="translate(0,-30)">
    <circle cx="440" cy="300" r="170" fill="url(#halo)"/>
    <circle cx="760" cy="300" r="170" fill="url(#halo)"/>

    <g>
      <path d="M340 300 Q440 218 540 300 Q440 382 340 300 Z" fill="#0a1830" stroke="#3aa0ff" stroke-width="2"/>
      <circle cx="440" cy="300" r="56" fill="url(#iris)"/>
      <circle cx="440" cy="300" r="56" fill="none" stroke="#6cc5ff" stroke-width="1.5"/>
      <circle cx="440" cy="300" r="38" fill="none" stroke="#6cc5ff" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="440" cy="300" r="14" fill="#eaf6ff"/>
      <line x1="360" y1="300" x2="392" y2="300" stroke="#6cc5ff" stroke-width="1.5"/>
      <line x1="488" y1="300" x2="520" y2="300" stroke="#6cc5ff" stroke-width="1.5"/>
    </g>
    <g>
      <path d="M660 300 Q760 218 860 300 Q760 382 660 300 Z" fill="#0a1830" stroke="#3aa0ff" stroke-width="2"/>
      <circle cx="760" cy="300" r="56" fill="url(#iris)"/>
      <circle cx="760" cy="300" r="56" fill="none" stroke="#6cc5ff" stroke-width="1.5"/>
      <circle cx="760" cy="300" r="38" fill="none" stroke="#6cc5ff" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="760" cy="300" r="14" fill="#eaf6ff"/>
      <line x1="680" y1="300" x2="712" y2="300" stroke="#6cc5ff" stroke-width="1.5"/>
      <line x1="808" y1="300" x2="840" y2="300" stroke="#6cc5ff" stroke-width="1.5"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="600" y="510" text-anchor="middle" font-family="'Chakra Petch','Segoe UI',sans-serif"
        font-size="82" font-weight="700" letter-spacing="6" fill="url(#word)">LO$T$0LZ</text>
  <text x="600" y="556" text-anchor="middle" font-family="'JetBrains Mono',monospace"
        font-size="20" letter-spacing="10" fill="#6cc5ff" fill-opacity="0.8">FORGING · FASHION · IN · 3D</text>
</svg>
